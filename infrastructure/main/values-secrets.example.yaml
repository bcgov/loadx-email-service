# Copy this file to a git-ignored local file, replace every placeholder, and
# pass it after values-tst.yaml or values-prd.yaml. Never deploy this file as-is.
mariadb:
  secret:
    database: sampledb
    username: sampleuser
    password: REPLACE_WITH_A_UNIQUE_DATABASE_PASSWORD
    rootPassword: REPLACE_WITH_A_UNIQUE_ROOT_PASSWORD

phplist:
  secrets:
    user: sampleuser
    phplistSecret: REPLACE_WITH_A_LONG_RANDOM_SECRET
    adminPassword: REPLACE_WITH_A_UNIQUE_ADMIN_PASSWORD
    adminEmail: admin@example.invalid
    remoteSecret: REPLACE_WITH_A_DIFFERENT_LONG_RANDOM_SECRET # You will get this once you launch the application for the first time in Config -> Settings -> Secret for remote processing
