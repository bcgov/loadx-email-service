apiVersion: v1
kind: Service
metadata:
  name: {{ template "app.fullname" . }}-phplist
  labels: {{ include "app.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.phplist.service.port }}
      targetPort: {{ .Values.phplist.service.port }}
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: phplist