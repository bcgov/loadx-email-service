apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "app.fullname" . }}-phplist-allow-from-f5-ingress
  labels: {{ include "app.labels" . | nindent 4 }}
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        - podSelector:
            matchLabels:
              {{- include "app.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: jobs
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: phplist
  policyTypes:
    - Ingress