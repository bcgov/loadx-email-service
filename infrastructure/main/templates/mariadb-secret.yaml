apiVersion: v1
kind: Secret
metadata:
  name: {{ template "app.fullname" . }}-mariadb
  labels: {{ include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-mariadb" (include "app.fullname" .)) }}
{{- if $secret }}
data:
{{ toYaml $secret.data | indent 2 }}
{{- else }}
stringData:
  MARIADB_DATABASE: {{ .Values.mariadb.secret.database | quote }}
  MARIADB_USER: {{ .Values.mariadb.secret.username | quote }}
  MARIADB_PASSWORD: {{ .Values.mariadb.secret.password | quote }}
  MARIADB_ROOT_PASSWORD: {{ .Values.mariadb.secret.rootPassword | quote }}
{{- end }}