apiVersion: v1
kind: Secret
metadata:
  name: {{ template "app.fullname" . }}-phplist
  labels: {{ include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-phplist" (include "app.fullname" .)) }}
{{- if $secret }}
data:
{{ toYaml $secret.data | indent 2 }}
{{- else }}
stringData:
  USER: {{ .Values.phplist.secrets.user | quote }}
  PHPLIST_SECRET: {{ .Values.phplist.secrets.phplistSecret | quote }}
  ADMIN_PASSWORD: {{ .Values.phplist.secrets.adminPassword | quote }}
  ADMIN_EMAIL: {{ .Values.phplist.secrets.adminEmail | quote }}
  REMOTE_SECRET: {{ .Values.phplist.secrets.remoteSecret | quote }}
{{- end }}
