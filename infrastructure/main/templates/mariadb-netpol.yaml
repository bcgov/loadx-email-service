apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "app.fullname" . }}-mariadb-allow-same-namespace
  labels: {{ include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mariadb
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "app.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: phplist
        - podSelector:
            matchLabels:
              {{- include "app.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: jobs
  policyTypes:
    - Ingress